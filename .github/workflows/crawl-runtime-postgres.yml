name: Durable crawl runtime PostgreSQL

on:
  pull_request:
    paths:
      - "runtime-worker/**"
      - ".github/workflows/crawl-runtime-postgres.yml"
  push:
    branches: [main]
    paths:
      - "runtime-worker/**"
      - ".github/workflows/crawl-runtime-postgres.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eal
          POSTGRES_PASSWORD: eal
          POSTGRES_DB: eal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eal -d eal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://eal:eal@127.0.0.1:5432/eal_test
    defaults:
      run:
        working-directory: runtime-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust 1.85
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy
      - name: Run PostgreSQL lease and recovery tests
        run: cargo +1.85.0 test --test postgres_queue -- --nocapture
