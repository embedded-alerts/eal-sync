name: Durable crawl runtime CI

on:
  pull_request:
    paths:
      - "runtime-worker/**"
      - ".github/workflows/crawl-runtime-ci.yml"
  push:
    branches: [main]
    paths:
      - "runtime-worker/**"
      - ".github/workflows/crawl-runtime-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: runtime-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust 1.85
        run: rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo +1.85.0 fmt -- --check
      - name: Clippy
        run: cargo +1.85.0 clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo +1.85.0 test --all-targets --all-features
      - name: Verify runtime contract
        run: python3 scripts/verify_contract.py
