[package]
name = "eal-sync"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "opto-sync/syncer.rs JSON reconciliation gateway for Embedded Alerts."
repository = "https://github.com/embedded-alerts/eal-sync"
publish = false

[package.metadata.opto-sync]
upstream = "https://github.com/opto-sync"
strategy = "offline-first"

[dependencies]
axum = { version = "0.8", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
syncer-rs = { git = "https://github.com/opto-sync/syncer.rs", rev = "132a97c77867128656070be85d3046b0cc065cbf" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
